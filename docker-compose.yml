services:
  db:
    image: postgres:16-alpine
    container_name: l8-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: l8_csat_nps
      POSTGRES_USER: l8_user
      POSTGRES_PASSWORD: l8_local_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U l8_user -d l8_csat_nps"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: l8-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://l8_user:l8_local_password@db:5432/l8_csat_nps
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "flask --app run:app db upgrade &&
             flask --app run:app run --host=0.0.0.0 --port=5000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: l8-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data: